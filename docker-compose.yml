version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gestion_correspondencia_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gestion_correspondencia
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestion_correspondencia_backend
    environment:
      - DATABASE_URL=mysql://root:rootpassword@db:3306/gestion_correspondencia
      - JWT_SECRET=super_secret_key_123
      - PORT=3000
    ports:
      - "3001:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # Corre migraciones, semillas (si es necesario) y arranca
    command: /bin/sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts || true && npm run start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestion_correspondencia_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
